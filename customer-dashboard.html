<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Dashboard • LogiTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="customer-page dashboard-page">
  <header class="public-header dashboard-header">
    <div class="public-nav dashboard-nav">
      <a href="index.html" class="brand">
        <span class="brand-icon">↗</span>
        <span>logi<span class="brand-accent">track</span><small>SMART DELIVERY</small></span>
      </a>
      <nav aria-label="Main navigation">
        <a href="account.html">Account</a>
        <a href="customer-dashboard.html" class="current" aria-current="page">My packages</a>
        <a href="courier-dashboard.html">Courier</a>
        <a href="dashboard.html">Admin</a>
        <button id="signout" class="outline-button" type="button">Sign out</button>
      </nav>
    </div>
  </header>
  <main class="shell account-space dashboard-space">
    <section class="panel dashboard-panel customer-dashboard-panel">
      <div class="dashboard-heading">
        <div>
          <span class="eyebrow">CUSTOMER SPACE</span>
          <h1>My deliveries</h1>
          <p>Track your packages and see the latest location shared by your delivery team.</p>
        </div>
      </div>
      <p id="live-message" class="dashboard-status" role="status">Connecting…</p>
      <div class="mini-stats">
        <div><strong id="count-total">0</strong><small>My shipments</small></div>
        <div><strong id="count-active">0</strong><small>On the way</small></div>
        <div><strong id="count-done">0</strong><small>Delivered</small></div>
      </div>
      <div class="field-grid dashboard-package-picker">
        <label for="customer-shipments">Choose a package
          <select id="customer-shipments"><option value="">Loading…</option></select>
        </label>
        <button class="outline-button" id="reload" type="button">Refresh packages</button>
      </div>
      <div id="package-summary" class="shipment-info"></div>
      <div id="gps-map" class="tracking-map" aria-label="Last reported package location map"></div>
      <p id="gps-age" class="muted dashboard-gps-note"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/shipments-live.js"></script>
</body>
</html>
